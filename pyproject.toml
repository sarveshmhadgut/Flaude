[project]
name = "flaude"
version = "0.1.0"
description = "A chatbot that asks before it acts, remembers who you are, and looks things up instead of making them up."
readme = "README.md"
requires-python = ">=3.14, <=3.15"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-google-genai",
    "langsmith",
    "pydantic",
    "python-dotenv",
    "rich",
    "pandas",
    "numpy",
    "langchain-community",
    "duckduckgo-search",
    "langchain-experimental",
    "ddgs",
    "networkx",
    "matplotlib",
    "catppuccin",
    "termcolor",
    "streamlit",
    "watchdog",
    "langgraph-checkpoint-sqlite",
    "sympy",
    "langchain-chroma",
    "pypdf",
    "langgraph-checkpoint-postgres",
    "psycopg[binary,pool]",
    "colorlog>=6.10.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestRemovedIn10Warning",
]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (F401 unused imports, F841 unused variables strictly enforced)
    "I",    # isort import sorting
    "UP",   # pyupgrade (Python 3.14 modern syntax)
]
ignore = [
    "E402", # Module level import not at top of file
]
